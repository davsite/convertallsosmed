name: Build Sosmedify APK

on:
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub
  push:
    branches:
      - main
      - master
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android-app/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          cp android-app/app/build/outputs/apk/debug/*.apk release-apk/sosmedify-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sosmedify-App-Debug
          path: release-apk/sosmedify-v1.0.0.apk
          retention-days: 14

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "📱 Sosmedify Android App v1.0.0"
          body: |
            ### 🌿 Sosmedify Android Application (Live Web Sync)
            Unduh file APK Sosmedify langsung ke smartphone Android Anda.
            
            - **Fitur**: Live Web Sync, Download Manager MP4 & MP3, Pull to Refresh, Offline Zen Screen.
            - **Nama Berkas**: `sosmedify-v1.0.0.apk`
          files: release-apk/sosmedify-v1.0.0.apk
          generate_release_notes: false
